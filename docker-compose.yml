version: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: school-mate-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "h", "localhost"]
      timeout: 30s
      retries: 10
    env_file:
      - .env

  redis:
    image: redis
    container_name: school-mate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  application:
    build:
      context: .
      dockerfile: Dockerfile
    image: yoontaebin/school-mate:version1
    container_name: school-mate-server
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
volumes:
  mysql_data:
  redis_data:
